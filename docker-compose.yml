services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@db:5432/portfolio
      JWT_SECRET: dev-secret
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    ports:
      - "${API_PORT:-3000}:3000"

  front:
    build:
      context: ./front
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONT_PORT:-80}:80"

volumes:
  postgres_data:
